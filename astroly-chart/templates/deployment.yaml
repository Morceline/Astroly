apiVersion: apps/v1
kind: Deployment
metadata:
  name: astroly-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: astroly
  template:
    metadata:
      labels:
        app: astroly
    spec:
      containers:
      - name: astroly
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: 3000